name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24, 26]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Setup Java (for XSD validation)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
          
    - name: Install dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi
      
    - name: Run linter
      run: npm run lint
      
    - name: Run tests
      run: npm test
      
    - name: Run all checks
      run: npm run all

    # Load-and-save report over the Flowable engine's CMMN models; fails on a
    # difference that is not in test/roundtrip/known-losses.json
    - name: Fetch Flowable engine models
      if: matrix.node-version == 26
      run: npm run roundtrip:fetch

    - name: Load-and-save report
      if: matrix.node-version == 26
      run: npm run roundtrip

    - name: Upload load-and-save report
      if: always() && matrix.node-version == 26
      uses: actions/upload-artifact@v4
      with:
        name: roundtrip-report
        path: roundtrip-report.*
        if-no-files-found: ignore